name: pruebas
on: [push, pull_request]
jobs:
  pruebas:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python -m pip install pillow  # la pastilla del overlay se dibuja con Pillow
      - run: python -m unittest discover scripts -v
