<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Plan Challenger · Companion</title>
<style>
:root{--bg:#FFFCF8;--card:#FFFFFF;--txt:#272927;--muted:#818181;--soft:#A1A1A1;--line:#E8E7E7;--dark:#282828;--dark2:#383838;
--amber:#D08726;--amberbg:#F8DEBD;--amberfg:#6B3C08;--teal:#478F96;--tealbg:#D0FBFF;--tealfg:#2E6A70;--red:#CA6B6E;--redbg:#FBF0F3;--redfg:#9A3A3E;--okbg:#D6FFDD;--okfg:#1F5C2A}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font-family:Mulish,'Segoe UI',sans-serif;font-size:16px}
.app{display:flex;min-height:100vh}
nav{width:101px;flex-shrink:0;background:#fff;display:flex;flex-direction:column;align-items:center;padding-top:57px;gap:30px;box-shadow:0 1px 25px rgba(0,0,0,.02)}
nav button{width:60px;height:60px;border-radius:12px;border:none;background:none;display:flex;align-items:center;justify-content:center;cursor:pointer}
nav button[aria-current]{background:var(--dark)}
main{flex:1 1 779px;max-width:779px;padding:57px 40px 40px;display:flex;flex-direction:column;gap:32px}
h1{margin:0;font-size:28px}h2{margin:0;font-size:20px}
.sub{color:var(--muted)}
.card{background:var(--card);border-radius:12px;box-shadow:0 1px 50px rgba(0,0,0,.08);padding:20px;display:flex;flex-direction:column;gap:12px}
.tres{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.tres .card{min-height:240px}
.cab{display:flex;align-items:center;gap:16px}
.ico{width:58px;height:58px;border-radius:10px;background:#F1F1F1;object-fit:cover}
.big{display:flex;align-items:baseline;gap:8px;margin-top:8px}.big b{font-size:32px}.big span{color:var(--soft)}
.tag{align-self:flex-start;font-size:10px;font-weight:700;padding:4px 8px;border-radius:4px}
.amber{background:var(--amberbg);color:var(--amberfg)}.teal{background:var(--tealbg);color:var(--tealfg)}.red{background:var(--redbg);color:var(--redfg)}.ok{background:var(--okbg);color:var(--okfg)}
.pie{margin-top:auto;font-size:12px;color:var(--muted);line-height:1.4}.pie b{color:var(--txt)}
.regla{display:flex;align-items:center;gap:16px;line-height:1.4}
.num{flex-shrink:0;width:48px;height:48px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700}
.reglas .sub,.pie{font-size:14px}
.build{flex-direction:row;align-items:center;gap:20px;flex-wrap:wrap}
.item{width:40px;height:40px;border-radius:8px;background:#F1F1F1}
aside{flex:1 1 560px;background:var(--dark);color:#fff;border-radius:40px 0 0 40px;padding:50px 40px 40px;display:flex;flex-direction:column;gap:32px}
aside .sub{color:#CACACA}
.tile{height:82px;border-radius:10px;padding:10px 14px;display:flex;align-items:center;gap:12px;color:var(--txt)}
.tile img{width:44px;height:44px;border-radius:8px}.tile span{font-size:12px;color:#5F5F5F}
.est{border-radius:10px;background:var(--dark2);padding:20px;display:flex;flex-direction:column;gap:14px}
.barra{position:relative;height:14px;border-radius:25px;background:linear-gradient(90deg,#CA6B6E,#D08726,#D0FBFF,#478F96);margin-top:8px}
.marca{position:absolute;top:-4px;width:2px;height:22px;background:#fff}
.punto{position:absolute;top:-12px;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:#fff}
.escala{display:flex;justify-content:space-between;font-size:10px;color:#CACACA}
.counters{display:flex;gap:14px;flex-wrap:wrap}
.counter{width:150px;min-height:106px;border-radius:10px;background:#fff;color:var(--txt);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:8px}
.counter span{font-size:14px;color:#5F5F5F;display:flex;align-items:center;gap:8px}.counter img{width:32px;height:32px;border-radius:6px}
.counter b{font-size:24px}.counter small{font-size:11px;color:var(--muted)}
details summary{cursor:pointer;color:#CACACA}
.fila{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #4A4949}
.aviso{padding:12px 16px;border-radius:10px;font-weight:700}
.vacio{color:var(--muted)}
</style>
</head>
<body>
<div class="app">
<nav aria-label="Secciones">
<svg role="img" aria-label="Companion" width="40" height="40" viewBox="0 0 40 40" fill="none" stroke="#D08726" stroke-width="3"><circle cx="20" cy="20" r="16"></circle><path d="M12 20h16M20 12v16"></path></svg>
<div style="height:42px"></div>
<button aria-label="Companion" aria-current="page"><svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2"><path d="M4 4l11 11M20 4L9 15M13 17l4 4M11 17l-4 4M15 13l4-1M9 13l-4-1"></path></svg></button>
</nav>
<main id="main"><h1>Plan Challenger</h1><p class="sub">Conectando…</p></main>
<aside id="aside" hidden></aside>
</div>
<script>
const ROL = {TOP: "Top", JUNGLE: "Jungla", MIDDLE: "Mid", BOTTOM: "Bot", UTILITY: "Support"};
const FASES = {null: "Cliente cerrado", None: "Sin actividad", Lobby: "En lobby", Matchmaking: "Buscando partida", ReadyCheck: "Partida encontrada",
  ChampSelect: "Champ select", InProgress: "En partida", PreEndOfGame: "Fin de partida", EndOfGame: "Fin de partida", inicio: "Iniciando…"};
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const signo = (v, d = 0) => v == null ? "–" : (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(d);
const pct = p => Math.round(p * 100) + "%";
const img = (tipo, n, cls = "ico", alt = "") => `<img class="${cls}" src="/img/${tipo}/${encodeURIComponent(String(n).replace(/\W/g, ""))}.png" alt="${esc(alt)}" onerror="this.style.visibility='hidden'">`;

function regla(r) {  // 6 / 10 / 14+ como en el canvas, según de qué minuto habla la regla
  const [k, cls] = /14 al 25/.test(r.texto) ? ["14+", "red"] : /al 10/.test(r.texto) ? ["10", "teal"] : ["6", "amber"];
  return {k, html: `<div class="regla"><span class="num ${cls}">${k}</span><span><b>${esc(r.texto)}</b> <span class="sub">${esc(r.numero)}${r.pista ? " (pista: pocas partidas)" : ""}</span></span></div>`};
}

function champSelect(s) {
  const d = s.draft, rec = d.recs[0], pos = ROL[d.pos] || d.pos;
  if (d.recs.length > 1)  // sin rol de los rivales: una fila por rival
    return [`<h1>Selección de campeón</h1><span class="sub">${esc(pos)} · rol de los rivales desconocido</span>
      <div class="card">${d.recs.map(r => `<div class="fila" style="border-color:var(--line)"><b>${esc(r.rival || "?")}</b><span>${r.filas && r.filas.length ? esc(r.filas[0].champ) + " " + pct(r.filas[0].est) : "sin datos"}</span></div>`).join("")}</div>`, ""];
  const fi = rec.ficha;
  if (!rec.conocido || !fi) return [`<h1>Selección de campeón</h1><span class="sub">${esc(pos)} · contra ${esc(rec.rival || "?")}</span>
      <div class="card"><b>${esc(rec.rival || "?")} no aparece en tus partidas</b><span class="sub">Va tu WR por campeón en el rol.</span></div>`, ""];
  const pq = fi.por_que, c = fi.cuidado, b = rec.build_dict, wr = s.rango && s.rango.n ? s.rango.wr / 100 : null;
  const main = `
  <div><h1>Selección de campeón</h1><span class="sub">${esc(pos)} · ${esc(fi.champ)} contra ${esc(fi.rival)}</span></div>
  <div class="tres">
    <div class="card"><div class="cab">${img("champion", fi.rival)}<b>Contra ${esc(fi.rival)}</b></div>
      <div class="big"><b>${pq.v}-${pq.n - pq.v}</b><span>con ${esc(fi.champ)}</span></div>
      ${pq.pocas ? `<span class="tag amber">▲ Pocas partidas (${pq.n})</span>` : ""}
      ${pq.oro14 != null ? `<span class="pie">Llegas al 14 con <b>${signo(pq.oro14)}</b> de oro contra él con ${esc(fi.champ)}.</span>` : ""}</div>
    <div class="card"><div class="cab">${img("champion", fi.champ)}<b>Tu ${esc(fi.champ)}</b></div>
      <div class="big"><b>${pct(pq.wr_rol)}</b><span>${pq.n_rol} partidas</span></div>
      ${wr != null ? (pq.wr_rol < wr ? `<span class="tag red">▼ Bajo tu WR (${pct(wr)})</span>` : `<span class="tag ok">▲ Sobre tu WR (${pct(wr)})</span>`) : ""}
      <span class="pie">WR en ${esc(pos)} con este campeón.</span></div>
    <div class="card"><div class="cab"><span class="ico red" style="display:flex;align-items:center;justify-content:center"><svg aria-hidden="true" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#CA6B6E" stroke-width="2"><path d="M12 3l9 16H3z"></path><path d="M12 10v4M12 17v.5"></path></svg></span><b>Cuidado</b></div>
      ${c.n ? `<div class="big"><b>${c.v}-${c.n - c.v}</b><span>tú contra ${esc(c.rival)}</span></div>
      <span class="tag ${c.pocas ? "amber" : "red"}">Wilson ${pct(c.ic[0])}–${pct(c.ic[1])}${c.pocas ? " · pista" : ""}</span>` : `<span class="sub">Sin partidas contra ${esc(c.rival)}.</span>`}
      ${c.muertes6 != null ? `<span class="pie">Mueres antes del 6 <b>${c.muertes6.toFixed(1)}</b> veces (tu media ${c.ref.muertes6 != null ? c.ref.muertes6.toFixed(1) : "–"})${(c.anticipa || []).includes("muertes6") ? "; tiende a repetirse contra él" : ""}.</span>` : ""}
      ${c.notas.map(n => `<span class="pie">Tu nota: ${esc(n)}</span>`).join("")}</div>
  </div>
  <div class="card reglas" style="padding:20px 30px 26px;gap:22px">
    <div style="display:flex;justify-content:space-between;align-items:center"><h2>Cómo jugarlo</h2><span class="sub" style="font-size:12px">Tus ${fi.reglas.length} metas de la partida</span></div>
    ${fi.reglas.map(regla).sort((a, b) => ["6", "10", "14+"].indexOf(a.k) - ["6", "10", "14+"].indexOf(b.k)).map(r => r.html).join("")}
  </div>
  ${b ? `<div class="card build"><h2>Build</h2>
    <div style="display:flex;align-items:center;gap:8px;color:var(--muted)">${b.core.map(([n, p, id]) => img("item", id, "item", n)).join("→")}</div>
    <span class="tag teal" style="font-size:12px;padding:8px 10px">${esc(b.runa ? b.runa[0] : "")} · ${esc(b.skills ? b.skills[0] : "")}</span>
    <span class="sub" style="font-size:12px">${b.fuente === "tu" ? "Tu build" : "Build de los mejores"} (${b.n} partidas, WR ${pct(b.wr)})</span></div>` : ""}
  ${(rec.avisos || []).map(a => `<div class="aviso red">${esc(a)}</div>`).join("")}`;
  const est = pq.est, x = v => Math.max(0, Math.min(100, (v - .4) / .3 * 100));  // escala 40–70%
  const aside = `
  <div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:22px;font-weight:600">Pickea</h2></div>
  <div style="display:grid;grid-template-columns:187px 1fr;gap:20px">
    <div style="display:flex;flex-direction:column;gap:20px">
      <div class="tile amber">${img("champion", fi.rival, "", fi.rival)}<div><span>Rival</span><br><b>${esc(fi.rival)}</b></div></div>
      <div class="tile teal"><div><span>Rol</span><br><b>${esc(pos)}</b></div></div>
    </div>
    <div class="est"><span>Estimado contra ${esc(fi.rival)}</span>
      <div style="display:flex;justify-content:space-between;align-items:center"><b style="font-size:24px">${pct(est)}</b><span class="tag ok" style="font-size:12px">Mejor pick</span></div>
      <div class="barra"><div class="punto" style="left:${x(est)}%"></div>${wr != null ? `<div class="marca" style="left:${x(wr)}%"></div>` : ""}</div>
      <div class="escala"><span>40</span><span>50</span><span>60</span><span>70</span></div>
      <span style="font-size:12px;color:#CACACA">${esc(pq.frase)}${wr != null ? ` Línea = tu WR general (${pct(wr)}).` : ""}</span>
    </div>
  </div>
  ${rec.filas.length > 1 ? `<details><summary>Otras ${rec.filas.length - 1} opciones</summary>${rec.filas.slice(1, 4).map(f => `<div class="fila"><b>${esc(f.champ)}</b><span>${esc(f.vd)} · ${pct(f.est)}</span></div>`).join("")}</details>` : ""}
  <div style="height:1px;background:#4A4949"></div>
  <div style="display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start">
    <div style="display:flex;flex-direction:column;gap:16px;flex:1">
      <div><h2 style="font-size:22px;font-weight:600">Counters de tu ${esc(fi.champ)}</h2><span class="sub">Contra ellos vas peor (récord y CS al 14)</span></div>
      <div class="counters">${fi.counters.lista.length ? fi.counters.lista.map(k => `<div class="counter"><span>${img("champion", k.rival, "", "")}${esc(k.rival)}</span>
        <b>${signo(k.cs14)} ${k.cs14 < 0 ? '<span style="color:#CA6B6E">↓</span>' : ""}</b><small>CS al 14 · ${k.v}-${k.n - k.v}${k.pocas ? " · pista" : ""}</small></div>`).join("") : '<span class="sub">Sin counters medidos.</span>'}</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:14px">${img("champion", fi.champ, "", fi.champ).replace('class=""', 'style="width:160px;height:160px;border-radius:16px;border:3px solid #D08726"')}<b style="font-size:26px">${esc(fi.champ)}</b></div>
  </div>`;
  return [main, aside];
}

function otraFase(s) {  // en partida, al terminar y esperando: lo mínimo (la franja y la línea del canvas van en la próxima iteración)
  const r = s.revision, bloques = [`<div><h1>${esc(FASES[s.fase] ?? s.fase)}</h1><span class="sub">${esc(s.perfil)}</span></div>`];
  if (s.meta && s.fase === "InProgress") bloques.push(`<div class="card"><b>${esc(s.meta.texto)}</b></div>`);
  if (s.fin) bloques.push(`<div class="card"><span class="tag amber">Al terminar (foto en vivo)</span><b>${esc(s.fin.texto)}</b></div>`);
  if (r) bloques.push(`<div class="card"><span class="tag ${r.win ? "ok" : "red"}">${r.win ? "Victoria" : "Derrota"}${r.min ? " · " + r.min + " min" : ""}</span>
    <b>${esc(r.champ)}${r.rival ? " vs " + esc(r.rival) : ""} ${esc(r.kda || "")}</b>
    <span class="sub">Oro al 14 ${esc(r.oro)} · CS al 14 ${esc(r.cs)} · muertes 14–25 ${esc(r.m25)} · score ${esc(r.score)}</span></div>`);
  if (s.espera) bloques.push(`<div class="card"><span class="sub">${esc(s.espera)}</span></div>`);
  if (bloques.length === 1) bloques.push(`<div class="card"><span class="sub">Abre el cliente de LoL: aquí verás tu pick en champ select y la revisión al terminar.</span></div>`);
  return bloques.join("");
}

let v = -1;
async function tick() {
  try {
    const s = await (await fetch("/api/estado")).json();
    if (s.v !== v) {
      v = s.v;
      const [m, a] = s.fase === "ChampSelect" && s.draft ? champSelect(s) : [otraFase(s), ""];
      const av = s.aviso ? `<div class="aviso ${s.aviso.tipo === "consejo" ? "teal" : "red"}">${s.aviso.minuto != null ? "Min " + s.aviso.minuto + " · " : ""}${esc(s.aviso.texto)}</div>` : "";
      document.getElementById("main").innerHTML = av + m;
      const as = document.getElementById("aside"); as.innerHTML = a; as.hidden = !a;
    }
  } catch (e) { document.getElementById("main").innerHTML = `<h1>Plan Challenger</h1><p class="sub">Sin conexión con el companion.</p>`; v = -1; }
}
tick(); setInterval(tick, 2000);
</script>
</body>
</html>
