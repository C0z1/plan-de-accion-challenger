  v = -1; tick();
}
function ventana(accion, extra) {
  fetch("/api/ventana", {method: "POST", headers: {"X-HTC": "1", "Content-Type": "application/json"}, body: JSON.stringify({accion, ...extra})}).catch(() => {});
}
let recortada = false;
function recortar() {  // la barra que Edge dibuja por dentro = outerHeight - innerHeight: se recorta para que solo quede la nuestra
  const alto = window.outerHeight - window.innerHeight;
  if (alto > 0) ventana("recortar", {alto, dpr: window.devicePixelRatio || 1});
}
window.addEventListener("resize", () => { if (recortada) recortar(); });
async function descargar() {
  try { await fetch("/api/descargar", {method: "POST", headers: {"X-HTC": "1"}}); } catch (e) {}
  v = -1; tick();
}
async function guardarAcceso() {
  const t = (document.getElementById("acceso") || {}).value || "";
  try { await fetch("/api/acceso", {method: "POST", headers: {"X-HTC": "1", "Content-Type": "application/json"}, body: JSON.stringify({token: t.trim()})}); } catch (e) {}
  v = -1; tick();
}
async function recargar() {
  try { await fetch("/api/recargar", {method: "POST", headers: {"X-HTC": "1"}}); } catch (e) {}
  v = -1; tick();
}
async function autoarranque(on) {
  try { await fetch("/api/autoarranque", {method: "POST", headers: {"X-HTC": "1", "Content-Type": "application/json"}, body: JSON.stringify({on})}); } catch (e) {}
  v = -1; tick();
}
function quieto() {
  const on = document.documentElement.classList.toggle("quieto");
  try { localStorage.setItem("htc-quieto", on ? "1" : ""); } catch (e) {}
  v = -1; tick();
}
try { if (localStorage.getItem("htc-quieto")) document.documentElement.classList.add("quieto"); } catch (e) {}

let elegida = location.hash.slice(1) || null, ultFase;  // vista que eligió el usuario (o #vista en la URL); se olvida al cambiar de fase
function ver(x) { elegida = x; v = -1; tick(); }

let v = -1;
async function tick() {
  try {
    const r = await fetch("/api/estado?desde=" + v);
    if (r.status === 304) return;  // nada cambió
    const s = await r.json();
    if (document.activeElement && document.activeElement.tagName === "INPUT") return;  // no borrar lo que estás escribiendo
    if (s.v !== v) {
      v = s.v;
      if (s.fase !== ultFase) { if (ultFase !== undefined) elegida = null; ultFase = s.fase; }
      const vista = elegida || (s.fase === "ChampSelect" ? (s.draft ? "companion" : "draft") : EN_PARTIDA.includes(s.fase) || s.fin || s.revision ? "envivo" : "inicio");
      for (const b of VISTAS) document.getElementById("b-" + b).toggleAttribute("aria-current", vista === b);
      const [m, a] = vista === "inicio" ? inicio(s) : vista === "draft" ? draftV(s) : vista === "envivo" ? envivo(s) : vista === "campeones" ? campeonesV(s)
        : vista === "errores" ? erroresV(s) : vista === "ajustes" ? ajustesV(s) : vista === "companion" && !s.draft ? (s.previa ? champSelect({...s, draft: s.previa}) : draftV(s)) : vista === "perfil" ? perfil(s) : vista === "partidas" ? [partidas(s), ""] : s.draft ? champSelect(s) : [otraFase(s), ""];  // el último champ select se puede volver a ver en partida
      document.getElementById("barra-v").hidden = !s.sin_marco; document.body.classList.toggle("sin-marco", !!s.sin_marco);
      if (s.sin_marco && !recortada) { recortada = true; recortar(); }
      const nv = s.nueva ? `<div class="aviso teal" role="status">Hay una versión nueva de Racha (${esc(s.nueva.version)}). <a href="${esc(s.nueva.url)}" target="_blank" rel="noopener" style="color:inherit;font-weight:800">Descárgala aquí →</a></div>` : "";
      const av = nv + (s.aviso ? `<div class="aviso ${s.aviso.tipo === "consejo" ? "teal" : "red"}">${s.aviso.minuto != null ? "Min " + s.aviso.minuto + " · " : ""}${esc(s.aviso.texto)}</div>` : "");
      const mn = document.getElementById("main"); mn.classList.toggle("ancho", !a); mn.innerHTML = av + m;  // sin columna derecha (Partidas_Vino): a todo el ancho
      const as = document.getElementById("aside"); as.innerHTML = a; as.hidden = !a;
    }
  } catch (e) {  // sin servidor o una vista que truena: no son lo mismo y el usuario debe poder reportarlo
    console.error(e); v = -1;
    document.getElementById("main").innerHTML = e instanceof TypeError && /fetch/i.test(e.message) ? `<h1>Racha</h1><p class="sub">Sin conexión con el companion.</p>`
      : `<h1>Racha</h1><div class="aviso red">Esta vista falló: ${esc(String(e && e.message || e))}. Prueba otra vista y repórtalo con este texto.</div>`;
  }
}
const VISTAS = ["inicio", "draft", "companion", "envivo", "perfil", "partidas", "campeones", "errores", "ajustes"];
const NAV = {  // íconos de la barra lateral, tal cual Home_Vino (Inicio = logo: 28 px y rosa; el resto 22 px)
  inicio: ["Inicio", '<path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/>'],
  draft: ["Draft", '<path d="M14.5 17.5L3 6V3h3l11.5 11.5"/><path d="M13 19l6-6"/><path d="M16 16l4 4"/><path d="M19 21l2-2"/><path d="M14.5 6.5L18 3h3v3l-3.5 3.5"/><path d="M5 14l4 4"/><path d="M7 17l-3 3"/><path d="M3 19l2 2"/>'],
  companion: ["Selección", '<circle cx="12" cy="8" r="4"/><path d="M5 21v-1a7 7 0 0 1 14 0v1"/><path d="M16 4l2-2M8 4L6 2"/>'],
  envivo: ["En vivo", '<circle cx="12" cy="12" r="9"/><path d="M10 8l6 4-6 4z"/>'],
  perfil: ["Perfil", '<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>'],
  partidas: ["Partidas", '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>'],
  campeones: ["Campeones", '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9"/><path d="M16 3.1a4 4 0 0 1 0 7.8"/>'],
  errores: ["Errores", '<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4"/><path d="M12 17h.01"/>'],
  ajustes: ["Ajustes", '<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>']};
for (const [b, [t, p]] of Object.entries(NAV)) {
  const n = b === "inicio" ? 28 : 22;
  document.getElementById("b-" + b).innerHTML = `<svg aria-hidden="true" width="${n}" height="${n}" viewBox="0 0 24 24" fill="none" stroke="${b === "inicio" ? "#F28DB0" : "currentColor"}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>${t}`;
}
tick(); setInterval(tick, 2000);
</script>
